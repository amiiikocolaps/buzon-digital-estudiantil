<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración | Buzón Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4fbff;
  color:#102a43;
}

header{
  background:#0b2d4d;
  color:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.container{
  width:min(1100px,92%);
  margin:35px auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 7px 25px rgba(11,45,77,.08);
}

h1,h2{
  color:#0b2d4d;
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #cbdde7;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.primary{
  background:#0b2d4d;
  color:white;
}

.green{
  background:#0d684d;
  color:white;
}

.red{
  background:#b3261e;
  color:white;
}

.gray{
  background:#e6eef3;
  color:#102a43;
}

.hidden{
  display:none!important;
}

.error{
  background:#fff0f0;
  border-left:5px solid #c62828;
  padding:13px;
  border-radius:8px;
  margin-top:15px;
}

.success{
  background:#e9f8ef;
  border-left:5px solid #0d684d;
  padding:13px;
  border-radius:8px;
  margin-top:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#f1f9fc;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:#0b2d4d;
}

.petition{
  border:1px solid #dbe8ee;
  border-radius:14px;
  padding:20px;
  margin-top:15px;
}

.petition h3{
  margin-bottom:5px;
}

.meta{
  color:#607d8b;
  font-size:13px;
  margin-bottom:12px;
}

.message{
  white-space:pre-wrap;
  margin:12px 0;
}

.comment{
  background:#f4fbff;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
}

.announcement{
  background:#f4fbff;
  border-left:5px solid #0d684d;
  padding:15px;
  margin-top:12px;
  border-radius:8px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}
