<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón Digital Estudiantil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --celeste: #8ed8f8;
      --celeste-claro: #eaf9ff;
      --azul: #12385b;
      --verde: #174f43;
      --blanco: #ffffff;
      --gris: #64748b;
      --borde: #d7e5ed;
      --fondo: #f5fbfe;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--azul);
    }

    header {
      background: var(--azul);
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .container {
      width: min(950px, 92%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(18, 56, 91, .08);
      border: 1px solid var(--borde);
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--celeste);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: var(--verde);
      color: white;
      width: 100%;
      margin-top: 18px;
    }

    .secondary {
      background: var(--celeste);
      color: var(--azul);
    }

    .rules {
      background: var(--celeste-claro);
      border-left: 5px solid var(--celeste);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .petition {
      border: 1px solid var(--borde);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      background: white;
    }

    .petition h3 {
      margin-bottom: 7px;
    }

      display: inline-block;
      background: var(--azul);
      color: white;
